<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Média Escolar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .logo-container {
            margin-bottom: 35px;
        }
        .logo-container img {
            max-width: 280px;
            height: auto;
        }

        h2 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #1a1a1a;
        }
        p {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
        }

        /* AJUSTE AQUI: Mudado para centralizar e remover o vazio */
        .input-group {
            margin: 25px 0;
            display: flex;
            justify-content: center; /* Centraliza o par label/input */
            align-items: center;
            background-color: #f9f9f9;
            padding: 15px 25px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
        }
        
        /* AJUSTE AQUI: Mais próximo do input */
        label {
            font-size: 22px;
            font-weight: 500;
            margin-right: 20px; /* Cria uma separação curta e fixa */
        }

        input {
            width: 120px;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #333;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0056b3;
        }

        .resultado {
            margin-top: 50px;
            font-size: 38px;
            font-weight: bold;
            color: #1a1a1a;
            border-top: 2px dashed #eee;
            padding-top: 30px;
        }
        #media-val {
            color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Mantido para GitHub Pages -->
        <div class="logo-container">
            <img src="ete.png" alt="Logo ETE">
        </div>

        <h2>Cálculo de Média</h2>
        <p>Digite as 3 notas abaixo:</p>

        <div class="input-group">
            <label for="nota1">Nota 1</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" oninput="calcularMedia()">
        </div>

        <div class="input-group">
            <label for="nota2">Nota 2</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" oninput="calcularMedia()">
        </div>

        <div class="input-group">
            <label for="nota3">Nota 3</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" oninput="calcularMedia()">
        </div>

        <div class="resultado">
            Média Anual: <span id="media-val">---</span>
        </div>
    </div>

    <script>
        function calcularMedia() {
            const n1 = parseFloat(document.getElementById('nota1').value);
            const n2 = parseFloat(document.getElementById('nota2').value);
            const n3 = parseFloat(document.getElementById('nota3').value);
            
            const elementoResultado = document.getElementById('media-val');

            if (!isNaN(n1) && !isNaN(n2) && !isNaN(n3)) {
                const media = (n1 + n2 + n3) / 3;
                elementoResultado.textContent = media.toFixed(1);
            } else {
                elementoResultado.textContent = "---";
            }
        }
    </script>
</body>
</html>
