<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Média Escolar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }
        /* Estilo para centralizar e limitar o tamanho da logo */
        .logo-container {
            margin-bottom: 20px;
        }
        .logo-container img {
            max-width: 180px; /* Ajuste o tamanho como preferir */
            height: auto;
        }
        .input-group {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        input {
            width: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        label {
            font-size: 16px;
        }
        .resultado {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #4a4a4a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="ete.png" alt="Logo ETE">
        </div>

        <h2>Cálculo de Média</h2>
        <p>Digite as 3 notas abaixo:</p>

        <div class="input-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1" oninput="calcularMedia()">
        </div>

        <div class="input-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1" oninput="collapse()); calcularMedia()">
        </div>

        <div class="input-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1" oninput="calcularMedia()">
        </div>

        <div class="resultado">
            Média: <span id="media-val">---</span>
        </div>
    </div>

    <script>
        function calcularMedia() {
            const n1 = parseFloat(document.getElementById('nota1').value);
            const n2 = parseFloat(document.getElementById('nota2').value);
            const n3 = parseFloat(document.getElementById('nota3').value);
            
            const elementoResultado = document.getElementById('media-val');

            if (!isNaN(n1) && !isNaN(n2) && !isNaN(n3)) {
                const media = (n1 + n2 + n3) / 3;
                elementoResultado.textContent = media.toFixed(1);
            } else {
                elementoResultado.textContent = "---";
            }
        }
    </script>
</body>
</html>
